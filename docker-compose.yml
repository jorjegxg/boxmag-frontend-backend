services:
  mysql:
    image: mysql:8.0
    container_name: boxmag4-mysql
    restart: unless-stopped
    mem_limit: 512m
    # Bind to loopback only — host nginx proxies; never publish on 0.0.0.0.
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-boxmag4}"
      MYSQL_USER: "${MYSQL_USER:-boxmag4}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}"
      TZ: "${TZ:-UTC}"
    # Cap memory on a 4GB VPS — default MySQL can balloon under load.
    command:
      [
        "mysqld",
        "--default-authentication-plugin=mysql_native_password",
        "--innodb-buffer-pool-size=128M",
        "--max-connections=50",
        "--performance-schema=OFF",
        "--table-open-cache=200",
      ]
    volumes:
      - boxmag4_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:latest
    container_name: boxmag4-minio
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:${MINIO_PORT_API:-9000}:9000"
      - "127.0.0.1:${MINIO_PORT_CONSOLE:-9001}:9001"
    environment:
      # Server root (volume init); app uses MINIO_ROOT_* as access-key credentials.
      MINIO_ROOT_USER: "${MINIO_SERVER_ROOT_USER:-${MINIO_ROOT_USER:-boxmagadmin}}"
      MINIO_ROOT_PASSWORD: "${MINIO_SERVER_ROOT_PASSWORD:-${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD or MINIO_SERVER_ROOT_PASSWORD in .env}}"
    command: server /data --console-address ":9001"
    volumes:
      - boxmag4_minio_data:/data

  backend:
    profiles: ["app"]
    build:
      context: ./boxmag-backend
      dockerfile: Dockerfile
      target: production
    command: ["node", "dist/server.js"]
    container_name: boxmag4-backend
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:${PORT:-3005}:3005"
    env_file:
      - ./.env
    environment:
      # NODE_ENV comes from .env (production). For Stripe test keys in prod set
      # STRIPE_ALLOW_TEST_KEYS=1 — see assertProductionEnv in boxmag-backend.
      NODE_OPTIONS: "--max-old-space-size=192"
      DB_HOST: mysql
      DB_PORT: 3306
      MINIO_ENDPOINT: minio
      MINIO_PORT_API: 9000
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    profiles: ["app"]
    build:
      context: ./boxmag4
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_BACKEND_URL: ${BACKEND_PUBLIC_URL:?set BACKEND_PUBLIC_URL in .env}
        NEXT_PUBLIC_TAX_PERCENT: ${NEXT_PUBLIC_TAX_PERCENT:-21}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
        NEXT_PUBLIC_INFO_EMAIL: ${NEXT_PUBLIC_INFO_EMAIL:-}
        NEXT_PUBLIC_B2B_EMAIL: ${NEXT_PUBLIC_B2B_EMAIL:-}
        NEXT_PUBLIC_ORDERS_EMAIL: ${NEXT_PUBLIC_ORDERS_EMAIL:-}
    container_name: boxmag4-frontend
    command: ["npm", "run", "start"]
    restart: unless-stopped
    # next-server has repeatedly OOM-killed at ~700MB–1.2GB on this 4GB host.
    mem_limit: 512m
    ports:
      - "127.0.0.1:3006:3006"
    env_file:
      - ./.env
    environment:
      SITEMAP_BACKEND_URL: http://backend:3005
      NODE_OPTIONS: "--max-old-space-size=384"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3006/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: boxmag4-autoheal
    restart: unless-stopped
    mem_limit: 32m
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  boxmag4_mysql_data:
  boxmag4_minio_data:
