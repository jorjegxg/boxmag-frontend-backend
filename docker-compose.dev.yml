services:
  backend:
    build:
      target: build
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 300
    command: >
      sh -c "if [ ! -x node_modules/.bin/ts-node-dev ]; then npm ci; fi &&
      npm run dev"
    volumes:
      - ./boxmag-backend:/app
      - boxmag4_backend_node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      target: build
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 300
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      SITEMAP_BACKEND_URL: http://backend:3005
    command: >
      sh -c "if [ ! -x node_modules/.bin/next ]; then npm ci; fi &&
      npm run dev -- --hostname 0.0.0.0"
    volumes:
      - ./boxmag4:/app
      - boxmag4_frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  boxmag4_backend_node_modules:
  boxmag4_frontend_node_modules:
