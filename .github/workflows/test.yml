name: Test

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run HTTP smoke + Cypress smoke.cy.ts (requires services; local/self-hosted only)"
        type: boolean
        default: false

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: boxmag-backend/package-lock.json
      - name: Test backend
        working-directory: boxmag-backend
        run: |
          npm ci
          npm test

  test-frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: boxmag4/package-lock.json
      - name: Test frontend unit
        working-directory: boxmag4
        run: |
          npm ci
          npm test

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: boxmag4/package-lock.json
      - name: Build frontend
        working-directory: boxmag4
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3005
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_TAX_PERCENT: "21"
        run: |
          npm ci
          npm run build

  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_smoke == true }}
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend-unit, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Note
        run: |
          echo "Smoke job is intended for environments with backend :3005 and frontend :3006 already available."
          echo "Set BACKEND_URL / FRONTEND_URL secrets or skip if services are not provisioned on this runner."
          echo "Locally: bash scripts/smoke-http.sh && cd boxmag4 && npx cypress run --spec cypress/e2e/smoke.cy.ts"
          exit 0
