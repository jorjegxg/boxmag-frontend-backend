    <circle cx="14" cy="5" r="2"/>
    <circle cx="22" cy="5" r="2"/>
  </g>

  <rect x="88" y="200" width="272" height="40" rx="12" fill="#edf2f7" stroke="#e2e8f0" stroke-width="1"/>
