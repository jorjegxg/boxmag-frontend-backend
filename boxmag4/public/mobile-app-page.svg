    <rect x="100" y="432" width="48" height="48" rx="8" fill="#e2e8f0"/>
    <text x="164" y="452" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#2d3748">BF20 BOXFIX</text>
    <text x="164" y="472" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#718096">from 0.51 EUR / pc</text>
    <rect x="308" y="444" width="40" height="28" rx="8" fill="#F7674A"/>
    <text x="328" y="463" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#ffffff">+</text>
  </g>

