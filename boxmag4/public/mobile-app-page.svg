<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 880" width="440" height="880" role="img" aria-labelledby="title desc">
  <title id="title">BOXMAG mobile app screen (vector mockup)</title>
  <desc id="desc">Smartphone frame with B2B shop UI: search, product cards, cart bar, bottom navigation.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8eef5"/>
      <stop offset="100%" stop-color="#dce6f0"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7674A"/>
      <stop offset="100%" stop-color="#e85538"/>
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.22"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="440" height="880" fill="url(#bgGrad)"/>

  <g filter="url(#phoneShadow)">
    <rect x="52" y="48" width="336" height="784" rx="44" ry="44" fill="#2d3748"/>
