  <text x="96" y="648" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#a0aec0">Subtotal excl. VAT</text>
  <text x="348" y="640" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="end">142.30 EUR</text>

